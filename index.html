<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.U.R & B.M | Surprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; background: #000; }
        
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .start-btn { padding: 15px 35px; font-size: 1.2rem; color: #fff; background: linear-gradient(45deg, #ff4b2b, #ff9a9e); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 25px rgba(255, 75, 43, 0.6); }

        .video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .content-overlay { position: relative; height: 100vh; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #fff; z-index: 10; }
        .glass-box { background: rgba(0, 0, 0, 0.6); padding: 30px; border-radius: 25px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); max-width: 85%; display: none; animation: fadeIn 2s ease-in; }
        .anniversary-title { font-family: 'Dancing Script', cursive; font-size: 3.2rem; color: #ff9a9e; margin-bottom: 10px; }
        h1 { font-size: 1.6rem; margin: 0; color: #fff; }
        .message-text { font-size: 1.1rem; line-height: 1.6; color: #fff; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }

        #mini-timer { position: fixed; bottom: 20px; right: 20px; background: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 12px; border: 1px solid rgba(255, 154, 158, 0.4); color: #ff9a9e; font-size: 0.85rem; z-index: 20; display: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .heart { position: absolute; bottom: -100px; font-size: 25px; animation: move 4s linear infinite; z-index: 5; opacity: 0.8; }
        @keyframes move { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

    <div id="overlay" onclick="startSurprise()">
        <button class="start-btn">Open Surprise ❤️</button>
    </div>

    <div id="mini-timer">
        ⏳ <span id="days">0</span>D : <span id="hours">0</span>H : <span id="minutes">0</span>M : <span id="seconds">0</span>S
    </div>

    <div class="video-container">
        <video id="bgVideo" playsinline>
            <source id="videoSource" src="video1.mp4" type="video/mp4">
        </video>
    </div>

    <div class="content-overlay">
        <div id="step1" class="glass-box">
            <div class="anniversary-title">Happy Anniversary!</div>
            <h1>M.U.R. DEEGHAYU ❤️ B.M. DULAKSHI</h1>
        </div>

        <div id="step2" class="glass-box">
            <p class="message-text">
                අකීකරැ හිත කැලි කෑලි වලට කැඩිලා ගිහිල්ල තිබ්බත්💔, <br>
                ආදරේ කියන ගම් එකෙන් ඔයා ඒක ඇලෙව්වා ❤💕. <br>
                කිසිම පනක් තිබ්බෙ නැති මගේ හිතට ඔයා පන දුන්නා 💟💝... <br><br>
                <b>ඉතින් මම හැමදාටමත් ඔයාට ආදරෙයි ❤. <br>I Love You Menikh ..</b>
            </p>
        </div>
    </div>

    <script>
        const video = document.getElementById('bgVideo');
        const source = document.getElementById('videoSource');
        const targetDate = new Date("August 1, 2026 00:00:00").getTime();

        function startSurprise() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('mini-timer').style.display = 'block';
            
            video.play();

            // තත්පර 12න් නම් පේනවා
            setTimeout(() => {
                document.getElementById('step1').style.display = 'block';
            }, 12000);

            // තත්පර 24න් වීඩියෝව මාරු වී මැසේජ් එක පේනවා
            setTimeout(() => {
                document.getElementById('step1').style.display = 'none';
                source.src = "video2.mp4";
                video.load();
                video.play();
                document.getElementById('step2').style.display = 'block';
            }, 24000);

            setInterval(updateCountdown, 1000);
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const gap = targetDate - now;
            const second = 1000, minute = second * 60, hour = minute * 60, day = hour * 24;
            document.getElementById('days').innerText = Math.floor(gap / day);
            document.getElementById('hours').innerText = Math.floor((gap % day) / hour);
            document.getElementById('minutes').innerText = Math.floor((gap % hour) / minute);
            document.getElementById('seconds').innerText = Math.floor((gap % minute) / second);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const icons = ['❤️', '💖', '💝', '💕'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
