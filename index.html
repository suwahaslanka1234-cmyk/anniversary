<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.U.R & B.M | Surprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        /* ආරම්භක තිරය */
        #click-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; color: white;
        }
        .start-btn {
            padding: 15px 40px; font-size: 1.3rem; color: #fff;
            background: linear-gradient(45deg, #ff4b2b, #ff9a9e);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 75, 43, 0.6);
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* වීඩියෝ එක */
        #bg-video {
            position: fixed; right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: 1; object-fit: cover;
            display: none; /* පටන් ගනිද්දී පේන්නේ නැහැ */
        }

        /* වීඩියෝ එක ඉවර වුණාම පේන පණිවිඩය */
        .content {
            text-align: center; z-index: 2;
            display: none; opacity: 0;
            transition: opacity 1.5s ease-in;
            width: 85%;
        }
        .glass-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px; border-radius: 30px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        .anniversary-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem; color: #ff9a9e; margin-bottom: 10px;
        }
        .message-text {
            font-size: 1.1rem; line-height: 1.8; color: #fff;
            margin: 20px 0;
        }
        .next-btn {
            padding: 12px 35px; font-size: 1.1rem;
            background: #ff4b2b; color: white;
            border: none; border-radius: 25px;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
        }

        /* හාර්ට් ඇනිමේෂන් */
        .heart {
            position: absolute; bottom: -100px; font-size: 25px;
            animation: move 4.5s linear infinite; z-index: 5; opacity: 0.8;
        }
        @keyframes move {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- පළමු පියවර: User ට Click කරන්න දෙනවා -->
    <div id="click-overlay" onclick="startExperience()">
        <p style="margin-bottom: 20px; opacity: 0.8;">Something special is waiting...</p>
        <button class="start-btn">OPEN SURPRISE ❤️</button>
    </div>

    <!-- දෙවන පියවර: වීඩියෝ එක -->
    <video playsinline id="bg-video">
        <source src="video1.mp4" type="video1.mp4">
    </video>

    <!-- තෙවන පියවර: වීඩියෝ එක ඉවර වුණාම පේන content එක -->
    <div class="content" id="mainContent">
        <div class="glass-box">
            <div class="anniversary-title">Happy Anniversary!</div>
            <h2 style="color: white; margin: 0;">M.U.R. ❤️ B.M.</h2>
            <p class="message-text">
                අකීකරැ හිත කැලි කෑලි වලට කැඩිලා ගිහිල්ල තිබ්බත්💔, <br>
                ආදරේ කියන ගම් එකෙන් ඔයා ඒක ඇලෙව්වා ❤💕. <br>
                කිසිම පනක් තිබ්බෙ නැති මගේ හිතට ඔයා පන දුන්නා 💟💝... <br><br>
                <b>ඉතින් මම හැමදාටමත් ඔයාට ආදරෙයි ❤.</b>
            </p>
            <button class="next-btn" onclick="showNextVideo()">Next Video ❤️</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('bg-video');
        const content = document.getElementById('mainContent');
        const overlay = document.getElementById('click-overlay');

        // 1. User Click කළාම වීඩියෝ එක පටන් ගන්නවා
        function startExperience() {
            overlay.style.display = "none";
            video.style.display = "block";
            video.play();
            
            // හාර්ට් ඇනිමේෂන් එක පටන් ගන්නවා
            setInterval(createHeart, 400);
        }

        // 2. වීඩියෝ එක (video1.mp4) ප්ලේ වෙලා ඉවර වුණාම
        video.onended = function() {
            video.style.opacity = "0"; // වීඩියෝ එක හෙමින් අයින් කරනවා
            setTimeout(() => {
                video.style.display = "none";
                content.style.display = "block"; // මැසේජ් එක පෙන්වනවා
                setTimeout(() => content.style.opacity = "1", 50);
                document.body.style.background = "linear-gradient(to bottom, #000000, #2c0000)"; 
            }, 500);
        };

        // 3. Next Video බටන් එක එබුවම video2.mp4 ප්ලේ වෙනවා
        function showNextVideo() {
            content.style.opacity = "0";
            setTimeout(() => {
                content.style.display = "none";
                video.src = "video2.mp4"; // දෙවැනි වීඩියෝවට මාරු කරනවා
                video.style.display = "block";
                video.style.opacity = "1";
                video.loop = true; // දෙවැනි වීඩියෝව දිගටම ප්ලේ වෙන්න ඕන නිසා
                video.play();
            }, 800);
        }

        // හාර්ට්ස් හැදීම
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const icons = ['❤️', '💖', '💝', '💕'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4500);
        }
    </script>
</body>
</html>
