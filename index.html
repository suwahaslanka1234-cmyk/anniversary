<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Arial', sans-serif;
        }
        #bg-video {
            position: fixed; right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: 1; /* වීඩියෝ එක උඩින් තියෙන්නේ */
            object-fit: cover;
        }
        .content {
            text-align: center;
            z-index: 2;
            display: none; /* මුලින්ම පේන්නේ නැහැ */
        }
        h1 {
            color: #ff4d6d; font-size: 4rem;
            animation: fadeIn 2s ease-in;
        }
        .next-btn {
            margin-top: 20px; padding: 15px 40px;
            font-size: 1.5rem; background: #ff4d6d;
            color: white; border: none; border-radius: 30px;
            cursor: pointer; transition: 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
    </style>
</head>
<body>
      
    <!-- වීඩියෝ එක (මේක loop වෙන්නේ නැහැ, එක පාරයි ප්ලේ වෙන්නේ) -->
    <video autoplay muted playsinline id="bg-video">
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="content" id="mainContent">
        <h1>Happy Birthday 🎂🎉!</h1>
        <button class="next-btn" onclick="location.href='next.html'">ඉස්සරහට  යමුකෝ ❤</button>
    </div>

    <script>
        const video = document.getElementById('bg-video');
        const content = document.getElementById('mainContent');

        // වීඩියෝ එක ප්ලේ වෙලා ඉවර වුණාම මේ function එක වැඩ කරනවා
        video.onended = function() {
            video.style.display = "none"; // වීඩියෝ එක අයින් කරනවා
            content.style.display = "block"; // මැසේජ් එක පෙන්වනවා
            document.body.style.backgroundColor = "#f8e1e7"; // පසුබිම වෙනස් කරනවා
        };
    </script>
</body>
</html>
