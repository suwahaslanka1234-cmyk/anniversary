<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deeghayu ❤️ Dulakshi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: #000;
        }

        /* Background Video */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .video-background iframe {
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .container {
            z-index: 10;
            position: relative;
            background: rgba(0, 0, 0, 0.4); 
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            color: #fff;
            max-width: 700px;
            margin: 15vh auto;
        }

        /* Names Styling */
        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4, #ffb1ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 10px rgba(255, 154, 158, 0.5);
            font-weight: bold;
        }

        p.sub-text {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #fecfef;
        }

        #countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 15px;
            min-width: 65px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .time-box span {
            display: block;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            bottom: -100px;
            font-size: 20px;
            color: #ff4b2b;
            animation: move 5s linear infinite;
            z-index: 5;
        }

        @keyframes move {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="video-background">
        <iframe src="https://www.youtube.com/embed/u2IEDVXPcc8?autoplay=1&mute=1&controls=0&loop=1&playlist=u2IEDVXPcc8&rel=0&showinfo=0" 
                frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="container">
        <!-- ඔයාලගේ නම් මෙතන තියෙන්නේ -->
        <h1>M.U.R. DEEGHAYU ❤️ B.M. DULAKSHI</h1>
        <p class="sub-text">Our Love Story Continues</p>

        <div id="countdown">
            <div class="time-box"><span id="days">00</span>Days</div>
            <div class="time-box"><span id="hours">00</span>Hrs</div>
            <div class="time-box"><span id="minutes">00</span>Min</div>
            <div class="time-box"><span id="seconds">00</span>Sec</div>
        </div>
    </div>

    <script>
        // Anniversary Date: August 1st
        const anniversaryDate = new Date("August 1, 2026 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = anniversaryDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;
        }

        setInterval(updateCountdown, 1000);

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
