<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.U.R & B.M | Anniversary</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: 'Poppins', sans-serif; background: #000;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
        }

        .start-btn {
            padding: 15px 35px; font-size: 1.2rem; color: #fff;
            background: linear-gradient(45deg, #ff4b2b, #ff9a9e);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 75, 43, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        iframe {
            width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: none;
        }

        .content-overlay {
            position: relative; height: 100vh; width: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: #fff; z-index: 10;
        }

        .glass-box {
            background: rgba(0, 0, 0, 0.55); padding: 35px; border-radius: 25px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 85%; display: none;
            animation: fadeIn 2s ease-in;
        }

        .anniversary-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem; color: #ff9a9e; margin-bottom: 10px;
        }

        h1 { font-size: 1.8rem; margin: 0; color: #fff; }

        .message-text {
            font-size: 1.2rem; line-height: 1.7; color: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .heart {
            position: absolute; bottom: -100px; font-size: 25px;
            animation: move 4s linear infinite; z-index: 5; opacity: 0.8;
        }

        @keyframes move {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Start Overlay -->
    <div id="overlay" onclick="startSurprise()">
        <button class="start-btn">Click to See Surprise ❤️</button>
    </div>

    <div class="video-container">
        <iframe id="mainVideo" src=""></iframe>
    </div>

    <div class="content-overlay">
        <!-- Step 1: Names & Happy Anniversary -->
        <div id="step1" class="glass-box">
            <div class="anniversary-title">Happy Anniversary!</div>
            <h1>M.U.R. DEEGHAYU ❤️ B.M. DULAKSHI</h1>
        </div>

        <!-- Step 2: Love Message -->
        <div id="step2" class="glass-box">
            <p class="message-text">
                අකීකරැ හිත කැලි කෑලි වලට කැඩිලා ගිහිල්ල තිබ්බත්💔, <br>
                ආදරේ කියන ගම් එකෙන් ඔයා ඒක ඇලෙව්වා ❤💕. <br>
                කිසිම පනක් තිබ්බෙ නැති මගේ හිතට ඔයා පන දුන්නා 💟💝... <br><br>
                <b>ඉතින් මම හැමදාටමත් ඔයාට ආදරෙයි ❤. <br>I Love You Menikh ..</b>
            </p>
        </div>
    </div>

    <script>
        const mainVideo = document.getElementById('mainVideo');
        const overlay = document.getElementById('overlay');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');

        function startSurprise() {
            overlay.style.display = 'none';
            
            // 1. මුලින්ම පළමු වීඩියෝ එක ප්ලේ කරනවා
            mainVideo.src = "https://www.youtube.com/embed/u2IEDVXPcc8?autoplay=1&controls=0&mute=0&playlist=u2IEDVXPcc8&loop=1";

            // 2. තත්පර 12කට පසු නම් සහ Anniversary කියන එක පෙන්වනවා
            setTimeout(() => {
                step1.style.display = 'block';
            }, 12000);

            // 3. තවත් තත්පර 12කට පසු (මුල සිට තත්පර 24කින්) ඊළඟ වීඩියෝ එක සහ මැසේජ් එක පෙන්වනවා
            setTimeout(() => {
                step1.style.display = 'none';
                mainVideo.src = "https://www.youtube.com/embed/gJ28BCZTVFQ?autoplay=1&controls=0&mute=0&playlist=gJ28BCZTVFQ&loop=1";
                step2.style.display = 'block';
            }, 24000);
        }

        // Floating Hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const icons = ['❤️', '💖', '💝', '💕'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
